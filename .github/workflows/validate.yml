name: Validate refresh logic
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate reference day and DST handling
        run: python3 refresh/verify.py
      - name: Validate sheet repair planning
        run: python3 -m unittest discover -s refresh -p 'test_*.py'
