<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minu elekter 2026</title><style>:root{--bg:#f7f8f4;--card:#fff;--ink:#171a1f;--muted:#7d8289;--line:#e6e7e2;--g:#267b17;--gb:#e9f4dd;--r:#b72b2b;--rb:#fae6e6;--gray:#f0f1ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 65% 0,#f3f7fb 0,transparent 38%),var(--bg);color:var(--ink);overscroll-behavior-y:contain}#pull{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;height:50px;transform:translateY(-50px);transition:transform .18s ease;font-size:12px;color:#5d6570;background:var(--bg);z-index:50;pointer-events:none}main{max-width:1400px;margin:auto;padding:26px 20px 40px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}h1{margin:0;font-size:34px;letter-spacing:-1px}header p{margin:5px 0 0;color:#5d6570}.updated{font-size:12px;color:var(--muted);text-align:right}.updated b{display:block;color:#53606f;margin-top:3px}.status{margin-top:5px;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.card,.month,.trend{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.035)}.card{padding:18px}.label{font-size:14px;color:#525861}.value{font-size:29px;font-weight:800;margin-top:5px}.sub{font-size:12px;color:#888f96;margin-top:5px}.good{color:var(--g)}.bad{color:var(--r)}.trend{padding:20px;margin-bottom:18px}.trendtop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.trend h2{font-size:17px;margin:0}.total{font-size:30px;font-weight:800;margin-top:4px}.chart{width:100%;height:240px;margin-top:8px}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.month{padding:15px}.mhead{display:flex;justify-content:space-between;gap:10px}.mhead h3{margin:0}.mstats{text-align:right;font-size:13px;color:#8b9097}.mstats b{display:block;font-size:16px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week{margin:10px 0 5px;color:#8b9097;font-size:11px;text-align:center}.day{aspect-ratio:1.15/1;border-radius:6px;background:var(--gray);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#b0b4b0;position:relative}.day.win{background:var(--gb);color:#315728}.day.loss{background:var(--rb);color:#7d2f2f}.dv{font-size:10px;margin-top:2px}.night{position:absolute;right:4px;top:4px;width:5px;height:5px;background:#2e8bd0;border-radius:50%}.blank{visibility:hidden}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;color:#666;font-size:12px}.sw{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:5px}.sw.g{background:var(--gb)}.sw.r{background:var(--rb)}.sw.x{background:var(--gray)}.dot{width:7px;height:7px;background:#2e8bd0;border-radius:50%;display:inline-block;margin-right:5px}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.months{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){main{padding:18px 12px 30px}header{flex-direction:column}.updated{text-align:left}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .card:nth-child(3){grid-column:1/-1}.months{grid-template-columns:1fr}.month{order:var(--mobile-order)}.value{font-size:24px}.trendtop{flex-direction:column}}</style></head><body><div id="pull">Tõmba värskendamiseks</div><main><header><div><h1>Minu elekter 2026</h1><p>Minu hinnaga vs börsihind – päevade kaupa</p></div><div class="updated">Viimane täielik andmepäev<b id="updated">Laen…</b><div id="status" class="status"></div></div></header><section class="kpis"><div class="card"><div class="label">Leping odavam</div><div id="contract" class="value good">–</div><div id="contractSub" class="sub">–</div></div><div class="card"><div class="label">Börs odavam</div><div id="spot" class="value bad">–</div><div id="spotSub" class="sub">–</div></div><div class="card"><div class="label">Netotulemus</div><div id="net" class="value">–</div><div id="netSub" class="sub">–</div></div><div class="card"><div class="label">Parim kuu</div><div id="best" class="value good">–</div><div id="bestSub" class="sub">–</div></div><div class="card"><div class="label">Halvim kuu</div><div id="worst" class="value bad">–</div><div id="worstSub" class="sub">–</div></div></section><section class="trend"><div class="trendtop"><div><h2>Kumulatiivne tulemus 2026</h2><div id="total" class="total">–</div></div><div id="consumption" class="sub"></div></div><svg id="chart" class="chart" viewBox="0 0 1000 240" preserveAspectRatio="none"></svg></section><section id="months" class="months"></section><div class="legend"><span><i class="sw g"></i>Leping odavam</span><span><i class="sw r"></i>Börs + marginaal odavam</span><span><i class="dot"></i>Ööhind kogu päev</span><span><i class="sw x"></i>Andmed puuduvad</span></div></main><script>const q=s=>document.querySelector(s),fmt=(n,d=2)=>new Intl.NumberFormat('et-EE',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n),eur=n=>`${n>=0?'+':'−'}${fmt(Math.abs(n),2)} €`,date=s=>new Intl.DateTimeFormat('et-EE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(s+'T12:00:00')),names=['Jaanuar','Veebruar','Märts','Aprill','Mai','Juuni','Juuli','August','September','Oktoober','November','Detsember'];function normalize(raw){let cumulative=0;const days=(raw.days||[]).map(a=>{const o=Array.isArray(a)?{date:a[0],result:Number(a[1]),consumption:Number(a[2]),allNight:!!a[3]}:{date:a.date,result:Number(a.result),consumption:Number(a.consumption),allNight:!!a.allNight};cumulative+=o.result;return{...o,cumulative}});const months=names.map((name,i)=>{const p=`2026-${String(i+1).padStart(2,'0')}-`,d=days.filter(x=>x&date.startsWith(p));return{month:i+1,name,result:d.length?d.reduce((s,x)=>s+x.result,0):null,consumption:d.length?d.reduce((s,x)=>s+x.consumption,0):null,days:d.length}}),withData=months.filter(x=>x.result!==null);return{ok:true,days,months,completeDays:days.length,contractCheaperDays:days.filter(x=>x.result>0).length,spotCheaperDays:days.filter(x=>x.result<0).length,netResult:days.reduce((s,x)=>s+x.result,0),totalConsumption:days.reduce((s,x)=>s+x.consumption,0),bestMonth:withData.reduce((a,b)=>b.result>a.result?b:a),worstMonth:withData.reduce((a,b)=>b.result<a.result?b:a)}}function render(D){const last=D.days.at(-1);q('#updated').textContent=date(last.date)+' 23:00';q('#status').textContent='Andmed värskendatud automaatselt';q('#contract').textContent=`${D.contractCheaperDays} / ${D.completeDays}`;q('#spot').textContent=`${D.spotCheaperDays} / ${D.completeDays}`;q('#contractSub').textContent=q('#spotSub').textContent=`päeva 01.01–${date(last.date).slice(0,5)}`;q('#net').textContent=eur(D.netResult);q('#net').className='value '+(D.netResult>=0?'good':'bad');q('#netSub').textContent=`01.01–${date(last.date)}`;q('#best').textContent=eur(D.bestMonth.result);q('#bestSub').textContent=D.bestMonth.name+' 2026';q('#worst').textContent=eur(D.worstMonth.result);q('#worstSub').textContent=D.worstMonth.name+' 2026';q('#total').textContent=eur(D.netResult);q('#total').className='total '+(D.netResult>=0?'good':'bad');q('#consumption').textContent='Kokku tarbimine '+new Intl.NumberFormat('et-EE',{maximumFractionDigits:0}).format(D.totalConsumption)+' kWh';const by=new Map(D.days.map(x=>[x.date,x])),mb=new Map(D.months.map(x=>[x.month,x])),root=q('#months');root.innerHTML='';for(let m=1;m<=12;m++){const M=mb.get(m),a=document.createElement('article');a.className='month';a.innerHTML=`<div class="mhead"><h3>${names[m-1]} 2026</h3><div class="mstats"><b class="${M?.result==null?'':M.result>=0?'good':'bad'}">${M?.result==null?'–':eur(M.result)}</b>${M?.consumption==null?'0':Math.round(M.consumption)} kWh</div></div><div class="week">${['E','T','K','N','R','L','P'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days"></div>`;const days=a.querySelector('.days'),off=(new Date(2026,m-1,1).getDay()+6)%7,cnt=new Date(2026,m,0).getDate();for(let i=0;i<off;i++){let e=document.createElement('div');e.className='day blank';days.append(e)}for(let d=1;d<=cnt;d++){const iso=`2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,x=by.get(iso),e=document.createElement('div');e.className='day'+(x?' '+(x.result>=0?'win':'loss'):'');e.innerHTML=`${x?.allNight?'<i class="night"></i>':''}<div>${d}</div>${x?`<div class="dv">${x.result>=0?'+':'−'}${fmt(Math.abs(x.result),2)}</div>`:''}`;if(x)e.title=`${date(x.date)}\n${eur(x.result)}\n${fmt(x.consumption,3)} kWh`;days.append(e)}a.style.setProperty('--mobile-order',String(m<=Number(last.date.slice(5,7))?-m:m));root.append(a)}draw(D.days)}function draw(data){const s=q('#chart');s.innerHTML='';const W=1000,H=240,p={l:50,r:12,t:12,b:30},vals=[0,...data.map(x=>x.cumulative)],lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max(10,(hi-lo)*.15),min=lo-pad,max=hi+pad,x=i=>p.l+i/(data.length-1||1)*(W-p.l-p.r),y=v=>p.t+(max-v)/(max-min)*(H-p.t-p.b),ns='http://www.w3.org/2000/svg',add=(t,a)=>{const e=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);s.append(e);return e};for(let i=0;i<5;i++){const v=min+(max-min)*i/4,yy=y(v);add('line',{x1:p.l,x2:W-p.r,y1:yy,y2:yy,stroke:'#e5e7e3'});const t=add('text',{x:p.l-7,y:yy+4,'text-anchor':'end',fill:'#7d858d','font-size':11});t.textContent=Math.round(v)+' €'}const pts=data.map((d,i)=>[x(i),y(d.cumulative)]),path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');add('path',{d:path,fill:'none',stroke:'#2c861c','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'})}const LIVE='https://script.google.com/macros/s/AKfycbyMNzypvGeLGxECljf8Btxg7TM3pCwjeul6b-Y06wZVhhyL8dsmz1zij-Vg6hy9I1gi9g/exec?dashboard=1';let loading=false;async function load(){if(loading)return;loading=true;try{let raw;try{const r=await fetch(LIVE+'&t='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);raw=await r.json()}catch(liveErr){const r=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);raw=await r.json()}if(!Array.isArray(raw.days)||!raw.days.length)throw Error('Andmed puuduvad');render(normalize(raw));q('#status').textContent='Kontrollitud '+new Date().toLocaleTimeString('et-EE',{hour:'2-digit',minute:'2-digit'})}catch(e){q('#status').textContent='Värskendamine ebaõnnestus. Proovin uuesti.'}finally{loading=false}}load();window.addEventListener('pageshow',()=>load());document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('online',()=>load());setInterval(()=>{if(!document.hidden)load()},60000);(function(){const pull=q('#pull');let startY=null,active=false,armed=false;const T=64;document.addEventListener('touchstart',e=>{if(window.scrollY<=0&&!loading){startY=e.touches[0].clientY;active=true;armed=false}},{passive:true});document.addEventListener('touchmove',e=>{if(!active||startY===null)return;const dy=e.touches[0].clientY-startY;if(dy>0&&window.scrollY<=0){e.preventDefault();pull.style.transform='translateY('+Math.min(dy*0.5,60)+'px)';armed=dy>T;pull.textContent=armed?'Vabasta värskendamiseks':'Tõmba värskendamiseks'}},{passive:false});document.addEventListener('touchend',()=>{if(!active)return;active=false;if(armed){pull.textContent='Värskendan…';pull.style.transform='translateY(50px)';load().finally(()=>{pull.style.transform='translateY(-50px)'})}else{pull.style.transform='translateY(-50px)'}startY=null;armed=false},{passive:true})})();</script></body></html>
